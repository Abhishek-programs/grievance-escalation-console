name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: docker compose up -d --wait
      - run: npm run migrate
      - run: npm run generate:data
      - run: npm test
      - run: npm run build
      - if: always()
        run: docker compose down -v
