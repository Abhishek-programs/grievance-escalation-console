services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: grievances
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d grievances"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql
volumes:
  pg_data: